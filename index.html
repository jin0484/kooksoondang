<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kooksoondang</title>
    <link rel="stylesheet" href="common/reset.css">
    <style>
        /* 인트로 영상 한 장만 있는 화면. 화면 높이에 꽉 채우고 넘치는 쪽은 잘라 냄 */
        /* 메인의 배경색과 같은 색. 인트로가 여기까지 흐려졌다가 메인이 같은 색에서 밝아 오므로 이음매가 보이지 않음 */
        body {
            background: #FAF8F7;
        }

        /* 메인에서 넘어온 경우에만 붙음(아래 인라인 스크립트가 주소로 판단).
           메인이 덮고 끝난 색 그대로 시작해 걷어 내므로 두 페이지가 이어져 보임 */
        html.is_page_fade::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #FAF8F7;
            pointer-events: none;
            animation: page_fade_in 700ms ease forwards;
        }

        @keyframes page_fade_in {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html.is_page_fade::before {
                animation: none;
                content: none;
            }
        }

        .intro {
            position: relative;
            transition: opacity 520ms ease;
        }

        .intro.is_leaving {
            opacity: 0;
        }

        /* 모서리는 사이트 공통 규칙(위 평평 / 아래 둥금)을 따름.
           이 파일은 common.css 를 쓰지 않아 변수를 못 읽으므로 색을 직접 적음
           (#FFD7BB = --kooksoondang_lighter, #F29556 = --kooksoondang_orange, #232323 = --bekseju_darker_cold) */
        .intro_skip {
            position: absolute;
            top: clamp(1rem, 2.5vw, 2rem);
            right: 100px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            /* 글자 크기는 그대로 두고 여백만 늘려 칩 크기를 10% 키움 (74.6x30 -> 82.1x33) */
            padding: 0.594rem 1.36rem;
            border-radius: 0.25rem 0.25rem 1rem 1rem;
            background: #FFD7BB;
            /* 두 배경 모두 밝은 톤이라 글자는 어두운 쪽이어야 읽힘 */
            color: #232323;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: background 220ms ease, transform 220ms ease;
        }

        .intro_skip:hover {
            background: #F29556;
            transform: translateY(-0.1rem);
        }

        .intro_skip:focus-visible {
            outline: 2px solid #F29556;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .intro_skip {
                transition: none;
            }

            .intro_skip:hover {
                transform: none;
            }
        }

        .intro_video {
            display: block;
            width: 100%;
            /* 주소창이 접혔다 펴지는 모바일에서 100vh 가 튀므로 지원하면 100dvh 를 씀 */
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            background: var(--bg_color, #FAF8F7);
        }
    </style>
    <!-- 메인에서 넘어온 경우에만 페이드 인. body 아래에서 붙이면 한 프레임 늦어 화면이 번쩍이므로 여기서 바로 표시해 둠 -->
    <script>
        if (new URLSearchParams(window.location.search).get('from') === 'main') {
            document.documentElement.classList.add('is_page_fade');
        }
    </script>
</head>

<body>
    <div class="intro">
        <!-- muted 가 있어야 브라우저가 자동 재생을 허용하고, playsinline 이 있어야 ios 에서 전체 화면으로 튀지 않음.
             끝나면 메인으로 넘어가야 하므로 loop 는 두지 않음 -->
        <video class="intro_video" src="asset/video/kooksoondang_intro.mp4" autoplay muted playsinline
            preload="auto"></video>
        <!-- from=intro 를 달아 두면 메인이 이 경로로 들어온 것을 알고 페이드 인으로 열림.
             js 가 막혀도 링크만으로 같은 효과가 나도록 주소에 직접 넣어 둠 -->
        <a class="intro_skip" href="main/main.html?from=intro">Skip &rsaquo;</a>
    </div>

    <script>
        (() => {
            const intro = document.querySelector('.intro');
            const video = document.querySelector('.intro_video');
            const skip = document.querySelector('.intro_skip');
            const target = skip?.getAttribute('href');

            if (!intro || !video || !target) return;

            // css 의 transition 과 같은 값. 다 흐려진 뒤에 이동해야 화면이 툭 끊기지 않음
            const leaveDuration = 520;
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            let isLeaving = false;

            // replace 라 뒤로 가기를 눌러도 인트로가 다시 뜨지 않음
            function goToMain() {
                if (isLeaving) return;

                isLeaving = true;

                if (reducedMotion) {
                    window.location.replace(target);
                    return;
                }

                intro.classList.add('is_leaving');
                window.setTimeout(() => window.location.replace(target), leaveDuration);
            }

            video.addEventListener('ended', goToMain);
            // 자동 재생이 막히거나 파일을 못 읽으면 마지막 화면에 갇히므로 그때도 넘겨 줌
            video.addEventListener('error', goToMain);

            skip.addEventListener('click', (event) => {
                // 새 탭·새 창으로 여는 경우는 그대로 두고, 평범한 클릭만 가로채 흐려지고 나서 이동
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;

                event.preventDefault();
                goToMain();
            });
        })();
    </script>
</body>

</html>
