<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#39936f"
  >

  <title>Brewing... | Kooksoondang</title>


  <!-- RESET CSS -->
  <link
    rel="stylesheet"
    href="../common/reset.css"
  >


  <!-- LOADING CSS -->
  <link
    rel="stylesheet"
    href="./loading.css"
  >


  <!-- LOADING JS -->
  <script
    src="./loading.js"
    defer
  ></script>

</head>


<body>


  <!-- =========================================================
       LOADING SCREEN
  ========================================================== -->

  <main
    class="loading_screen"
    aria-labelledby="loading_title"
    aria-busy="true"
  >


    <div
      class="loading_content"
      role="status"
      aria-live="polite"
    >


      <!-- =====================================================
           CUP + BOTTLE
      ====================================================== -->

      <div
        class="loading_illustration"
        aria-hidden="true"
      >


        <!-- CUP -->
        <div class="cup_group">


          <!-- DOT 1 -->
          <img
            class="loading_dot loading_dot_one"
            src="./product_detail_asset/icon/dot1.svg"
            alt=""
          >


          <!-- DOT 2 -->
          <img
            class="loading_dot loading_dot_two"
            src="./product_detail_asset/icon/dot2.svg"
            alt=""
          >


          <!-- CUP -->
          <img
            class="loading_cup"
            src="./product_detail_asset/icon/cup.svg"
            alt=""
          >


        </div>


        <!-- BOTTLE -->
        <img
          class="loading_bottle"
          src="./product_detail_asset/icon/Vector.svg"
          alt=""
        >


      </div>


      <!-- =====================================================
           BREWING TEXT
      ====================================================== -->

      <h1
        class="loading_title"
        id="loading_title"
      >
        Brewing<span class="loading_dots"></span>
      </h1>


    </div>


  </main>


</body>

</html>
