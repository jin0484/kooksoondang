<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kooksoondang</title>
    <link rel="stylesheet" href="common/reset.css">
    <!-- 페이지 전환 덮개. 첫 프레임부터 덮여 있어야 하므로 다른 스타일보다 먼저 읽어 둠 -->
    <link rel="stylesheet" href="common/page_transition.css">
    <style>
        /* 인트로 영상 한 장만 있는 화면. 화면 높이에 꽉 채우고 넘치는 쪽은 잘라 냄 */
        /* 다른 페이지의 배경색(--bg_color)과 같은 색.
           이 파일은 common.css 를 쓰지 않아 변수를 못 읽으므로 전환 덮개가 쓸 값을 직접 정해 둠 */
        :root {
            --bg_color: #FAF8F7;
        }

        body {
            background: var(--bg_color);
        }

        .intro {
            position: relative;
        }

        /* 모서리는 사이트 공통 규칙(위 평평 / 아래 둥금)을 따름.
           이 파일은 common.css 를 쓰지 않아 변수를 못 읽으므로 색을 직접 적음
           (#FFD7BB = --kooksoondang_lighter, #F29556 = --kooksoondang_orange, #232323 = --bekseju_darker_cold) */
        .intro_skip {
            position: absolute;
            top: clamp(1rem, 2.5vw, 2rem);
            right: 100px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            /* 글자 크기는 그대로 두고 여백만 늘려 칩 크기를 10% 키움 (74.6x30 -> 82.1x33) */
            padding: 0.594rem 1.36rem;
            border-radius: 0.25rem 0.25rem 1rem 1rem;
            background: #FFD7BB;
            /* 두 배경 모두 밝은 톤이라 글자는 어두운 쪽이어야 읽힘 */
            color: #232323;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: background 220ms ease, transform 220ms ease;
        }

        .intro_skip:hover {
            background: #F29556;
            transform: translateY(-0.1rem);
        }

        .intro_skip:focus-visible {
            outline: 2px solid #F29556;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .intro_skip {
                transition: none;
            }

            .intro_skip:hover {
                transform: none;
            }
        }

        .intro_video {
            display: block;
            width: 100%;
            /* 주소창이 접혔다 펴지는 모바일에서 100vh 가 튀므로 지원하면 100dvh 를 씀 */
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            background: var(--bg_color, #FAF8F7);
        }
    </style>
    <script src="common/page_transition.js" defer></script>
</head>

<body>
    <div class="intro">
        <!-- muted 가 있어야 브라우저가 자동 재생을 허용하고, playsinline 이 있어야 ios 에서 전체 화면으로 튀지 않음.
             끝나면 메인으로 넘어가야 하므로 loop 는 두지 않음 -->
        <video class="intro_video" src="asset/video/kooksoondang_intro.mp4" autoplay muted playsinline
            preload="auto"></video>
        <a class="intro_skip" href="main/main.html">Skip &rsaquo;</a>
    </div>

    <script>
        (() => {
            const video = document.querySelector('.intro_video');
            const skip = document.querySelector('.intro_skip');
            const target = skip?.getAttribute('href');

            if (!video || !target) return;

            // 화면을 덮으며 넘기는 일은 공통 전환(common/page_transition.js)에 맡김.
            // replace 라 뒤로 가기를 눌러도 인트로가 다시 뜨지 않음.
            // 전환 스크립트가 아직 안 읽혔거나 막혔더라도 갇히지 않도록 그냥 이동하는 길도 남겨 둠
            function goToMain() {
                if (window.sitePageTransition) window.sitePageTransition.leaveTo(target, { replace: true });
                else window.location.replace(target);
            }

            video.addEventListener('ended', goToMain);
            // 자동 재생이 막히거나 파일을 못 읽으면 마지막 화면에 갇히므로 그때도 넘겨 줌
            video.addEventListener('error', goToMain);

            skip.addEventListener('click', (event) => {
                // 새 탭·새 창으로 여는 경우는 그대로 두고, 평범한 클릭만 가로채 덮인 뒤에 이동
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;

                event.preventDefault();
                goToMain();
            });
        })();
    </script>
</body>

</html>
