<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kooksoondang</title>
    <link rel="stylesheet" href="common/reset.css">
    <!-- 페이지 전환 덮개. 첫 프레임부터 덮여 있어야 하므로 다른 스타일보다 먼저 읽어 둠 -->
    <link rel="stylesheet" href="common/page_transition.css">
    <link rel="stylesheet" href="index.css">
    <script src="common/page_transition.js" defer></script>
    <script src="index.js" defer></script>
</head>

<body>
    <div class="intro">
        <!-- muted 가 있어야 브라우저가 자동 재생을 허용하고, playsinline 이 있어야 ios 에서 전체 화면으로 튀지 않음.
             끝나면 인증 화면으로 넘어가야 하므로 loop 는 두지 않음 -->
        <video class="intro_video" src="asset/video/kooksoondang_intro.mp4" autoplay muted playsinline
            preload="auto"></video>
        <!-- 영상만 건너뜀. 인증은 건너뛸 수 없으므로 링크가 아니라 버튼임 -->
        <button type="button" class="intro_skip">Skip &rsaquo;</button>
    </div>

    <!--
        19세 인증. 영상이 끝나면 index.js 가 hidden 을 떼어 드러냄.
        data-pass = YES 를 눌렀을 때 갈 곳
    -->
    <section class="age_gate" id="age_gate" data-pass="test/test.html" hidden>
        <div class="age_gate_curve" aria-hidden="true"></div>

        <div class="age_gate_inner">
            <!-- 질문 화면 -->
            <div class="age_gate_view" data-view="ask">
                <h1 class="age_gate_title">Are you of legal drinking age?</h1>
                <div class="age_gate_actions">
                    <button type="button" class="age_gate_btn" data-answer="yes">YES</button>
                    <button type="button" class="age_gate_btn" data-answer="no">NO</button>
                </div>
            </div>

            <!-- NO 를 눌렀을 때 -->
            <div class="age_gate_view" data-view="deny" hidden>
                <h1 class="age_gate_title">Please come back later</h1>
                <p class="age_gate_desc">
                    You must be 19 or older to enter.<br>
                    See you next time!
                </p>
                <button type="button" class="age_gate_back" data-answer="back">Choose again</button>
            </div>
        </div>

        <img class="age_gate_logo" src="asset/logo/logo.svg" alt="kooksoondang">

        <!-- 오른쪽 아래에서 걸어 들어오는 할머니. test 페이지 인트로와 같은 그림·같은 방식이라
             파일도 그쪽 것을 그대로 씀(복사해 두면 한쪽만 고치는 일이 생김).
             walk1~3 을 겹쳐 두고 opacity 만 갈아 끼워서 걷는 동작을 만듦.
             그림을 못 읽으면 index.js 가 이 묶음을 통째로 감춤 -->
        <figure class="age_gate_character">
            <figcaption class="age_gate_bubble">Wanna come inside?</figcaption>
            <div class="age_gate_char_body">
                <img class="age_gate_char_frame walk1" src="test/test_asset/walk1.png" alt="" loading="lazy">
                <img class="age_gate_char_frame walk2" src="test/test_asset/walk2.png" alt="" loading="lazy">
                <img class="age_gate_char_frame walk3" src="test/test_asset/walk3.png" alt="" loading="lazy">
            </div>
        </figure>
    </section>
</body>

</html>
